name: CI of mc_triorb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [RelWithDebInfo]
        compiler: [gcc]
    env:
      ROS_DISTRO: jazzy
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # ── Pre-commit ──
    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: |
        pip install pre-commit
        pre-commit run --all-files

    - name: Setup ROS 2
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y curl gnupg2 lsb-release ca-certificates

        sudo mkdir -p /etc/apt/keyrings
        curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc \
          | gpg --dearmor \
          | sudo tee /etc/apt/keyrings/ros-archive-keyring.gpg > /dev/null

        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ros-archive-keyring.gpg] \
        http://packages.ros.org/ros2/ubuntu \
        $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

        sudo apt-get update
        sudo apt-get install -y ros-${ROS_DISTRO}-ros-base

    - name: Install dependencies
      uses: jrl-umi3218/github-actions/install-dependencies@master
      with:
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build-type }}
        run: |
          apt: libmc-rtc-dev
          apt-mirrors:
            mc-rtc:
              cloudsmith: mc-rtc/head

    - name: Install mc_triorb_description
      shell: bash
      run: |
        set -e

        source /opt/ros/${ROS_DISTRO}/setup.bash

        git clone https://github.com/isri-aist/mc_triorb_description.git /tmp/mc_triorb_description
        cd /tmp/mc_triorb_description
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
        cmake --build .
        sudo cmake --install .

    - name: Build and test
      uses: jrl-umi3218/github-actions/build-cmake-project@master
      with:
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build-type }}
